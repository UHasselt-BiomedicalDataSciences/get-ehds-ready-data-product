# Render the Quarto site and deploy it straight to GitHub Pages.
#
# The rendered site is a build artefact and is not committed to main (see
# .gitignore). This workflow is the only thing that publishes it, so what is
# live is always a fresh render of what is on main.
#
# There is no gh-pages branch: the render is uploaded as a Pages artefact and
# deployed by GitHub, which also means the legacy Jekyll builder never runs over
# the output.
#
# One-time setup in the repository: Settings → Pages → Source = "GitHub
# Actions".
name: Publish site

on:
  push:
    branches: [main]
  # Allows publishing by hand from the Actions tab.
  workflow_dispatch:

# What actions/deploy-pages needs: read the source, mint an OIDC token to prove
# the deployment came from this workflow, and write to Pages. Nothing writes to
# the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight one; never let two deploys race. Not
# cancel-in-progress: an interrupted deployment can leave Pages half-updated, so
# a running deploy is allowed to finish and the newer one queues behind it.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      # Pinned so a Quarto release cannot silently change the output. Bump
      # deliberately, and keep it in step with the version in CONTRIBUTING.md.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.41

      # The site is plain Markdown — no R, Python or Julia execution — so no
      # language runtime needs installing. The sync-book.sh post-render hook is
      # skipped here: it belongs to the private book toolchain and is git-ignored,
      # so it is not in this checkout, and the guard in _quarto.yml passes over it.
      - name: Render the site
        run: quarto render

      # output-dir in _quarto.yml. The action adds the .nojekyll marker itself,
      # so nothing downstream tries to run the output through Jekyll.
      - name: Upload the render as a Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Gives the run a "github-pages" deployment entry with the live URL on it.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
